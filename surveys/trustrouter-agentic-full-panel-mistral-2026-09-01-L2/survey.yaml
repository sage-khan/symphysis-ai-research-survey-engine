id: trustrouter-agentic-full-panel-mistral-2026-09-01-L2
title: 'TrustRouter Agentic Full Panel (mistral:7b) -- Level L2: Six trust dimensions
  inside DVS'
description: 'One of 7 sibling per-level surveys (parent run: trustrouter-agentic-full-panel-mistral-2026-09-01).
  The six trust lenses that make up the Data Value Score. Uses the flat bwm instrument
  answered via the OpenManus bwm_two_stage flow (runtime_backend=openmanus).'
instrument: bwm
instrument_params:
  dimensions:
  - Q
  - PT
  - V
  - IC
  - L
  - C
  dimension_labels:
    Q: Quality
    PT: Provenance Trust
    V: Verification Strength
    IC: Independent Confirmation
    L: Legal Compliance
    C: Criticality
  dimension_descriptions:
    Q: Is the data technically clean?
    PT: Can we trust who produced it?
    V: Cryptographic or audit-trail evidence?
    IC: Do multiple independent parties agree?
    L: Is this data required or regulated?
    C: How big is the impact if it is wrong?
