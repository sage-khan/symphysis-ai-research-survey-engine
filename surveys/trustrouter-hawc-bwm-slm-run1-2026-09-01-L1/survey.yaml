  - E
  - A
  dimension_labels:
    DVS: Data Value Score
    F: Technical Feasibility Fit
    E: Economic Value
    A: Attack Resistance
  dimension_descriptions:
    DVS: Composite trustworthiness of the data.
    F: How well the artefact fits ledger constraints (size, update rate, latency).
      F = 1 - P.
    E: Financial or asset value at stake if the data is corrupted or lost.
    A: Difficulty of undetected manipulation.
