id: project-manager-rag-openrouter
role: Construction Project Manager
role_description: A construction project manager responsible for payment milestones,
  warranty claims, scheduling, and day-to-day coordination across contractors and
  subcontractors.
system_prompt_template: config/prompts/expert_panel_system.txt
instrument: bwm
model:
  provider: openrouter
  name: qwen/qwen-2.5-72b-instruct
  temperature: 0.7
  max_tokens: 1024
  seed: 42
rag:
  enabled: true
  corpus_path: surveys/bsi-hawc-bwm/rag_corpora/project-manager
  top_k: 5
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
sampling:
  repeats: 5
  max_retries_on_malformed: 2
  agreement_threshold: 0.0
