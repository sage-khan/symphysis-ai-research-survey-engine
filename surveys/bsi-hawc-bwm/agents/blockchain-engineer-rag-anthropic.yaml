id: blockchain-engineer-rag-anthropic
role: Blockchain / DLT Engineer
role_description: A blockchain and distributed-ledger engineer with production experience
  in permissioned consortium chains (Hyperledger Fabric) and public L1/L2 deployments,
  including consensus-mechanism trade-offs and transaction-cost economics.
system_prompt_template: config/prompts/expert_panel_system.txt
instrument: bwm
model:
  provider: anthropic
  name: claude-sonnet-5
  temperature: 0.7
  max_tokens: 1024
  seed: 42
rag:
  enabled: true
  corpus_path: surveys/bsi-hawc-bwm/rag_corpora/blockchain-engineer
  top_k: 5
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
sampling:
  repeats: 5
  max_retries_on_malformed: 2
  agreement_threshold: 0.0
