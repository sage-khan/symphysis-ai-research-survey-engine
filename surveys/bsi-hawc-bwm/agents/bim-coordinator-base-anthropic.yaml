id: bim-coordinator-base-anthropic
role: BIM Coordinator
role_description: A BIM coordinator with 10+ years managing multi-stakeholder Building
  Information Models on renovation and new-build projects, responsible for model federation,
  clash detection, and lifecycle documentation.
system_prompt_template: config/prompts/expert_panel_system.txt
instrument: bwm
model:
  provider: anthropic
  name: claude-sonnet-5
  temperature: 0.7
  max_tokens: 1024
  seed: 42
rag:
  enabled: false
sampling:
  repeats: 5
  max_retries_on_malformed: 2
  agreement_threshold: 0.0
