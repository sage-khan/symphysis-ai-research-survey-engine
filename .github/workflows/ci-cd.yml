name: "CI/CD: Symphysis"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # 1. VALIDATE: syntax and lint (runs on every push and PR)
  # --------------------------------------------------------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.4.7

      - name: Lint Symphysis Python sources
        run: |
          ruff check src/ web/backend/ \
            --select E,W,F \
            --ignore E501,E402

      - name: Validate docker-compose syntax
        run: docker compose config -q

  # --------------------------------------------------------------------------
  # 2. TEST: full pytest suite (unit tests plus web-router tests through
  #    FastAPI's TestClient)
  # --------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r web/backend/requirements.txt
          pip install httpx

      - name: Run test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/web
        run: python -m pytest tests/ -q

  # --------------------------------------------------------------------------
  # 3. PACKAGE: build the sdist/wheel and verify the published package
  #    actually works installed standalone, in a clean venv with no repo
  #    checkout on PYTHONPATH: the concrete difference between "works when
  #    cloned" and "works when installed" that docs/plan/packaging-plan.md
  #    calls out as the thing to verify before ever cutting a PyPI release.
  #    Catches a packaging regression (missing package-data, a dependency
  #    only satisfied by this repo's dev environment, etc.) on every push,
  #    not just once by hand before the first release.
  # --------------------------------------------------------------------------
  package:
    name: Package
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          pip install -q build
          python -m build

      - name: Install the built wheel into a clean venv
        run: |
          python -m venv /tmp/clean-install
          /tmp/clean-install/bin/pip install -q --upgrade pip
          /tmp/clean-install/bin/pip install -q dist/*.whl

      - name: Run a minimal survey end to end, outside the repo checkout
        run: /tmp/clean-install/bin/python scripts/verify_clean_install.py

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: symphysis-dist
          path: dist/

  # --------------------------------------------------------------------------
  # 4. DEPLOY: SSH into the veritas server and restart the running stack,
  #    main branch only. This mirrors the manual deployment procedure
  #    documented in README.md's "Deploying on a shared server" section: the
  #    backend runs in a single Docker container on the host network (a
  #    volume-mounted repo checkout, no baked image), and the frontend is a
  #    plain nohup'd Vite dev server. Both are recreated on every deploy, so
  #    a changed requirements.txt or package.json is always picked up, not
  #    just a changed Python or JS source file.
  #
  #    The server's only internet-routable address (its campus IP) timed
  #    out from a GitHub-hosted runner (confirmed live: "dial tcp ...: i/o
  #    timeout"), presumably a campus firewall allowlist that doesn't cover
  #    GitHub's ephemeral runner IP ranges. The runner instead joins the
  #    same Tailscale network the server is already on, then reaches it at
  #    its stable Tailscale IP (SYMPHYSIS_SSH_HOST), which needs no
  #    firewall change on the campus network's side.
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to veritas server
    runs-on: ubuntu-latest
    needs: [validate, test, package]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # Deliberately short-lived: git pull + recreate both services, fully
      # detached (docker run -d, nohup), no inline waiting for either to
      # actually come up. An earlier version of this step waited inline
      # (a `curl` polling loop against localhost, inside this same SSH
      # exec channel) for the backend's ~140s pip install + startup, and
      # the whole SSH session was reproducibly killed at almost exactly
      # that same ~140s mark in two separate live runs, keep-alive output
      # notwithstanding: not an idle-connection timeout (ruled out: data
      # was flowing throughout), so most likely a fixed-duration limit
      # somewhere in the Tailscale DERP relay path for this specific
      # long-lived exec channel. Rather than chase that further, the
      # health-check polling moves to its own step below, run directly on
      # the runner (which is itself Tailscale-joined) against the
      # server's Tailscale IP -- a plain curl loop with no such limit,
      # and arguably a more meaningful check anyway (proves the service
      # is reachable from outside the box, not just from localhost on it).
      - name: Deploy via SSH (git pull + recreate services, detached)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SYMPHYSIS_SSH_HOST }}
          username: ${{ secrets.SYMPHYSIS_SSH_USER }}
          key: ${{ secrets.SYMPHYSIS_SSH_KEY }}
          port: ${{ secrets.SYMPHYSIS_SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.SYMPHYSIS_PROJECT_PATH }}"

            echo "=== Pulling latest main ==="
            git fetch origin
            git reset --hard origin/main

            echo "=== Recreating backend container (detached) ==="
            docker rm -f sage-backend 2>/dev/null || true
            docker run -d --name sage-backend \
              --network host \
              -v "$(pwd)":/app \
              -w /app \
              -e OLLAMA_BASE_URL=http://localhost:11434 \
              -e PYTHONPATH=/app/web:/app/src \
              -e CORS_EXTRA_ORIGINS="${{ secrets.SYMPHYSIS_CORS_EXTRA_ORIGINS }}" \
              python:3.11-slim \
              bash -c "apt-get update -qq && apt-get install -y --no-install-recommends -qq g++ >/dev/null \
                && pip install -q --no-cache-dir -r requirements.txt -r web/backend/requirements.txt \
                && exec uvicorn backend.main:app --host 0.0.0.0 --port 8100"

            echo "=== Restarting frontend dev server (npm install + npm run dev, both backgrounded) ==="
            # Found it: `pkill -f "vite.*--port 5180"` matches on each
            # candidate process's FULL command line, and this whole script
            # is sent to the remote shell as one long `bash -c "<script
            # text>"` argument -- so the deploy script's own invocation
            # contains the literal substring "vite.*--port 5180" (right
            # here, in this very line) and pkill -f was matching and
            # killing THIS SCRIPT ITSELF the instant it ran, not any real
            # vite process. Confirmed live: this explains every symptom
            # from the previous three attempts (instant death, zero
            # correlation with npm's own duration or foreground/background).
            # Fixed by tracking the vite process via a PID file instead of
            # pattern-matching its command line at all.
            if [ -f /tmp/symphysis-vite.pid ]; then
              kill "$(cat /tmp/symphysis-vite.pid)" 2>/dev/null || true
            fi
            (
              cd web/frontend
              npm install --no-audit --no-fund
              exec npm run dev -- --host 0.0.0.0 --port 5180
            ) < /dev/null > /tmp/symphysis-vite.log 2>&1 &
            echo $! > /tmp/symphysis-vite.pid
            disown

            echo "=== Container status right after recreation (services still starting up) ==="
            docker ps --filter name=sage-backend

      - name: Wait for backend + frontend health (from the runner, over Tailscale)
        run: |
          echo "=== Waiting for backend health check ==="
          timeout 180 bash -c \
            'until curl -sf http://${{ secrets.SYMPHYSIS_SSH_HOST }}:8100/api/health; do echo "  ...still waiting on backend"; sleep 5; done' \
            && echo "Backend is up"

          echo "=== Waiting for frontend to come up ==="
          timeout 60 bash -c \
            'until curl -sf http://${{ secrets.SYMPHYSIS_SSH_HOST }}:5180 >/dev/null; do echo "  ...still waiting on frontend"; sleep 2; done' \
            && echo "Frontend is up"
