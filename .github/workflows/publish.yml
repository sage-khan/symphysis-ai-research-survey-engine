# Publishes the `symphysis` package to PyPI when a GitHub Release is
# published. Kept separate from ci-cd.yml (which runs on every push/PR):
# publishing is a distinct, rarer, higher-stakes event, and should never
# fire on an ordinary commit to main.
#
# Uses PyPI's trusted-publisher OIDC flow (id-token: write + the pypi
# environment), not a stored API token secret, so no PyPI credential ever
# sits in this repo's secrets. One-time setup required before the first
# release: on pypi.org, under the `symphysis` project's (or, before it
# exists, the pending-publisher form's) "Publishing" settings, add a
# trusted publisher for this exact repo/workflow/environment:
#   Owner: sage-khan
#   Repository: symphysis-ai-research-survey-engine
#   Workflow name: publish.yml
#   Environment name: pypi
#
# This workflow uses actions that are not certified by GitHub. They are
# provided by a third-party and are governed by separate terms of service,
# privacy policy, and support documentation.

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Verify the built wheel installs and runs standalone
        run: |
          python -m venv /tmp/clean-install
          /tmp/clean-install/bin/pip install -q --upgrade pip
          /tmp/clean-install/bin/pip install -q dist/*.whl
          /tmp/clean-install/bin/python scripts/verify_clean_install.py
          /tmp/clean-install/bin/symphysis --help

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release-build]
    permissions:
      # Mandatory for the trusted-publisher OIDC flow.
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/symphysis

    steps:
      - name: Retrieve built distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
