# Minimal SearXNG configuration for this project's internal, self-hosted
# use case: a discovery backend for agentic_survey.tools.web_search, only
# ever reached by sibling containers on this app's own Docker Compose
# network, never exposed to the public internet. See
# docs/plan/symphysis-open-source-search-rag-architecture.md for why
# SearXNG was chosen (open source, self-hostable, no API key) and why the
# JSON format has to be explicitly enabled here (disabled by default).

use_default_settings: true

general:
  instance_name: "symphysis-internal-searxng"

server:
  # secret_key is used to obfuscate result URLs and for CSRF-style
  # protection, not a credential guarding access to anything; SearXNG
  # requires a non-empty value to start. Regenerate this for any
  # deployment you actually care about (e.g. `openssl rand -hex 32`)
  # rather than reusing this placeholder.
  secret_key: "symphysis-searxng-internal-instance-please-regenerate"
  limiter: false  # No bot-detection rate limiting: this instance has exactly one caller (this app's backend container), not the public internet.
  image_proxy: false

search:
  safe_search: 0
  formats:
    - html
    - json  # Required: agentic_survey.tools.web_search queries with format=json; disabled by default upstream.
